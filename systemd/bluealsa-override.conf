# Installed by volumio-bluetooth-receiver. Remove this file to restore the Volumio default.
# A2DP sink only (receive); codecs: SBC (default) + aptX + aptX HD (libfreeaptx).
# LDAC cannot be decoded: only the LDAC *encoder* library exists.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink -c aptX -c aptX-HD
